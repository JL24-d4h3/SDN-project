<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A8A"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E15A50"/>
    </marker>
  </defs>

  <title>Arquitectura global: capas y planos de la solución de seguridad SDN</title>

  <!-- ================= BANDA: ACTORES ================= -->
  <g>
    <rect x="40" y="24" width="1120" height="86" rx="10" fill="#E1EDFA" stroke="#9CC3E5" stroke-width="1.5"/>
    <text x="60" y="44" font-size="13" font-weight="bold" fill="#1E3A8A">ACTORES / SISTEMAS EXTERNOS</text>
    <rect x="60" y="54" width="230" height="44" rx="8" fill="#ffffff" stroke="#64748B" stroke-width="1.2"/>
    <text x="175" y="72" font-size="12.5" text-anchor="middle" fill="#0F172A">Usuario académico</text>
    <text x="175" y="88" font-size="10.5" text-anchor="middle" fill="#64748B">BASE por presencia · ACADÉMICO por login</text>
    <rect x="310" y="54" width="300" height="44" rx="8" fill="#ffffff" stroke="#64748B" stroke-width="1.2"/>
    <text x="460" y="72" font-size="12.5" text-anchor="middle" fill="#0F172A">Especialista TI · Administrador de Red · Superadministrador</text>
    <text x="460" y="88" font-size="10.5" text-anchor="middle" fill="#64748B">dispositivo registrado + autenticación + TOTP</text>
    <rect x="630" y="54" width="260" height="44" rx="8" fill="#ffffff" stroke="#64748B" stroke-width="1.2"/>
    <text x="760" y="72" font-size="12.5" text-anchor="middle" fill="#0F172A">Atacantes y sistemas externos</text>
    <text x="760" y="88" font-size="10.5" text-anchor="middle" fill="#64748B">sin rol: se observan, clasifican y contienen</text>
    <rect x="910" y="54" width="230" height="44" rx="8" fill="#ffffff" stroke="#64748B" stroke-width="1.2"/>
    <text x="1025" y="72" font-size="12.5" text-anchor="middle" fill="#0F172A">IdP institucional · DNS · NTP</text>
    <text x="1025" y="88" font-size="10.5" text-anchor="middle" fill="#64748B">sistema externo a la plataforma</text>
  </g>

  <!-- ================= BANDA: INTERACCIÓN ================= -->
  <g>
    <rect x="40" y="126" width="1120" height="86" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="60" y="146" font-size="13" font-weight="bold" fill="#1E3A8A">INTERACCIÓN</text>
    <rect x="60" y="156" width="220" height="44" rx="8" fill="#ffffff" stroke="#0284C7" stroke-width="1.4"/>
    <text x="170" y="174" font-size="12.5" text-anchor="middle" fill="#0F172A">Portal cautivo · 10.0.0.5</text>
    <text x="170" y="190" font-size="10.5" text-anchor="middle" fill="#64748B">I3 · única superficie que BASE alcanza</text>
    <rect x="300" y="156" width="220" height="44" rx="8" fill="#ffffff" stroke="#0284C7" stroke-width="1.4"/>
    <text x="410" y="174" font-size="12.5" text-anchor="middle" fill="#0F172A">Consola · 10.0.0.17</text>
    <text x="410" y="190" font-size="10.5" text-anchor="middle" fill="#64748B">I7 · operación y administración</text>
    <rect x="540" y="156" width="180" height="44" rx="8" fill="#ffffff" stroke="#0284C7" stroke-width="1.4"/>
    <text x="630" y="174" font-size="12.5" text-anchor="middle" fill="#0F172A">API northbound (I2)</text>
    <text x="630" y="190" font-size="10.5" text-anchor="middle" fill="#64748B">órdenes y consultas</text>
    <text x="770" y="174" font-size="11.5" fill="#334155">Los <tspan font-weight="bold">diez servicios</tspan> de la plataforma están todos en la banda de abajo; Portal y Consola</text>
    <text x="770" y="190" font-size="11.5" fill="#334155">son servicios de interacción, no partes de otro servicio.</text>
  </g>

  <!-- ================= BANDA: PLATAFORMA (10 servicios) ================= -->
  <g>
    <rect x="40" y="228" width="1120" height="210" rx="10" fill="#ffffff" stroke="#64748B" stroke-width="1.5"/>
    <text x="60" y="248" font-size="13" font-weight="bold" fill="#1E3A8A">PLATAFORMA DE SEGURIDAD — DIEZ SERVICIOS, TODOS VISIBLES Y SEPARADOS</text>
    <text x="60" y="264" font-size="10.5" fill="#64748B">cada uno con responsabilidad única, contrato propio y persistencia aislada (patrón Repository) · I6</text>

    <rect x="60" y="276" width="196" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
    <text x="158" y="296" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">IAM / AAA · .10</text>
    <text x="158" y="314" font-size="9.8" text-anchor="middle" fill="#475569">autenticación, sesiones, IdP</text>
    <rect x="268" y="276" width="196" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
    <text x="366" y="296" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Registro · .11</text>
    <text x="366" y="314" font-size="9.8" text-anchor="middle" fill="#475569">catálogo de dispositivos</text>
    <rect x="476" y="276" width="196" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
    <text x="574" y="296" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Monitor · .12</text>
    <text x="574" y="314" font-size="9.8" text-anchor="middle" fill="#475569">contadores, línea base EWMA</text>
    <rect x="684" y="276" width="196" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
    <text x="782" y="296" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Detección · .13</text>
    <text x="782" y="314" font-size="9.8" text-anchor="middle" fill="#475569">clasificación de anomalías</text>
    <rect x="892" y="276" width="196" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
    <text x="990" y="296" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Incidentes · .14</text>
    <text x="990" y="314" font-size="9.8" text-anchor="middle" fill="#475569">ciclo de vida INC-xxxx</text>
    <rect x="60" y="340" width="196" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
    <text x="158" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Políticas · .15</text>
    <text x="158" y="378" font-size="9.8" text-anchor="middle" fill="#475569">ABAC, escalera; única emisora I2</text>
    <rect x="268" y="340" width="196" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
    <text x="366" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Auditoría · .16</text>
    <text x="366" y="378" font-size="9.8" text-anchor="middle" fill="#475569">quién, qué, cuándo, por qué</text>
    <rect x="476" y="340" width="196" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
    <text x="574" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Adaptador del sensor · .18</text>
    <text x="574" y="378" font-size="9.8" text-anchor="middle" fill="#475569">alerta EVE JSON → bus</text>
    <rect x="684" y="340" width="404" height="52" rx="8" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2"/>
    <text x="886" y="360" font-size="11.5" text-anchor="middle" fill="#713F12">Portal (10.0.0.5) y Consola (.17) son servicios de la banda INTERACCIÓN —</text>
    <text x="886" y="378" font-size="11.5" text-anchor="middle" fill="#713F12">completan los diez; nadie los absorbe (IAM no «contiene» el Portal)</text>
  </g>

  <!-- ================= BANDA: BROKER ================= -->
  <g>
    <rect x="40" y="452" width="1120" height="64" rx="10" fill="#FBE8D0" stroke="#F5AA50" stroke-width="1.6"/>
    <text x="600" y="478" font-size="14" font-weight="bold" text-anchor="middle" fill="#9A4D00">EVENT BROKER — RabbitMQ 3.13 · 10.0.0.21</text>
    <text x="600" y="498" font-size="11" text-anchor="middle" fill="#9A4D00">exchange topic «plataforma» · colas durables por servicio · DLQ · cola FIFO por incidente inc.&lt;INC-id&gt; · entrega al menos una vez + idempotencia</text>
  </g>

  <!-- ================= BANDA: CONTROL ================= -->
  <g>
    <rect x="40" y="532" width="1120" height="86" rx="10" fill="#FBE4E2" stroke="#E15A50" stroke-width="1.6"/>
    <text x="60" y="552" font-size="13" font-weight="bold" fill="#B91C1C">CONTROL SDN</text>
    <rect x="410" y="560" width="380" height="46" rx="8" fill="#ffffff" stroke="#E15A50" stroke-width="1.5"/>
    <text x="600" y="580" font-size="13" font-weight="bold" text-anchor="middle" fill="#0F172A">ONOS 2.7 LTS · 10.0.0.20</text>
    <text x="600" y="597" font-size="10.5" text-anchor="middle" fill="#64748B">motor de traducción: órdenes → OpenFlow · topología · cookies</text>
    <text x="840" y="576" font-size="10.5" fill="#64748B">No autentica usuarios</text>
    <text x="840" y="592" font-size="10.5" fill="#64748B">ni decide política de seguridad:</text>
    <text x="840" y="608" font-size="10.5" fill="#64748B">traduce y coordina.</text>
  </g>

  <!-- ================= BANDA: DATA PLANE ================= -->
  <g>
    <rect x="40" y="634" width="1120" height="104" rx="10" fill="#D7EBD7" stroke="#7BAE7B" stroke-width="1.6"/>
    <text x="60" y="654" font-size="13" font-weight="bold" fill="#166534">PLANO DE DATOS — ocho switches Pica8/PicOS · OpenFlow 1.3</text>
    <rect x="60" y="664" width="150" height="34" rx="6" fill="#ffffff" stroke="#7BAE7B"/><text x="135" y="685" font-size="12" text-anchor="middle" fill="#0F172A">NC1 ═ NC2 · núcleo</text>
    <rect x="226" y="664" width="170" height="34" rx="6" fill="#ffffff" stroke="#7BAE7B"/><text x="311" y="685" font-size="12" text-anchor="middle" fill="#0F172A">D1 · D2 · distribución</text>
    <rect x="412" y="664" width="220" height="34" rx="6" fill="#ffffff" stroke="#7BAE7B"/><text x="522" y="685" font-size="12" text-anchor="middle" fill="#0F172A">A1 · A2 · A3 · A4 · acceso</text>
    <rect x="648" y="664" width="160" height="34" rx="6" fill="#ffffff" stroke="#7BAE7B"/><text x="728" y="685" font-size="12" text-anchor="middle" fill="#0F172A">13 enlaces dual-homed</text>
    <rect x="824" y="664" width="306" height="34" rx="6" fill="#ffffff" stroke="#7BAE7B"/><text x="977" y="685" font-size="11" text-anchor="middle" fill="#0F172A">VLAN 10 · 20 · 30 · 40 · FLOW · METER · GROUP</text>
    <text x="60" y="726" font-size="10.5" fill="#166534">La mitigación se instala en los switches de ingreso (P9) · el canal de control es out-of-band por ma1, jamás por la VLAN 20</text>
  </g>

  <!-- ================= BANDA: ACTIVOS ================= -->
  <g>
    <rect x="40" y="754" width="1120" height="86" rx="10" fill="#F2F2F2" stroke="#94A3B8" stroke-width="1.4"/>
    <text x="60" y="774" font-size="13" font-weight="bold" fill="#334155">ACTIVOS Y PERÍMETRO</text>
    <rect x="60" y="784" width="300" height="44" rx="8" fill="#ffffff" stroke="#7BAE7B" stroke-width="1.2"/>
    <text x="210" y="802" font-size="11.5" text-anchor="middle" fill="#0F172A">Servicios protegidos · VLAN 30</text>
    <text x="210" y="818" font-size="10" text-anchor="middle" fill="#64748B">general .10 · privilegiado .11 · crítico .12</text>
    <rect x="380" y="784" width="300" height="44" rx="8" fill="#ffffff" stroke="#F5AA50" stroke-width="1.2"/>
    <text x="530" y="802" font-size="11.5" text-anchor="middle" fill="#0F172A">Perímetro · VLAN 40</text>
    <text x="530" y="818" font-size="10" text-anchor="middle" fill="#64748B">espejo A4 p47 → Suricata → Adaptador → bus</text>
    <rect x="700" y="784" width="200" height="44" rx="8" fill="#ffffff" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="800" y="802" font-size="11.5" text-anchor="middle" fill="#0F172A">Internet</text>
    <text x="800" y="818" font-size="10" text-anchor="middle" fill="#64748B">origen de escenarios R5</text>
    <rect x="920" y="784" width="220" height="44" rx="8" fill="#ffffff" stroke="#E15A50" stroke-width="1.2"/>
    <text x="1030" y="802" font-size="11.5" text-anchor="middle" fill="#0F172A">Suricata 7 · 10.0.0.27</text>
    <text x="1030" y="818" font-size="10" text-anchor="middle" fill="#64748B">IDS fuera de camino (solo RX)</text>
  </g>

  <!-- ================= FLECHAS ================= -->
  <!-- Actores → Interacción -->
  <line x1="175" y1="98" x2="175" y2="154" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="460" y1="98" x2="430" y2="154" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- Interacción → Plataforma -->
  <line x1="175" y1="200" x2="175" y2="274" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="410" y1="200" x2="400" y2="274" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <!-- Plataforma ⇄ Broker (I5, dashed) -->
  <line x1="300" y1="328" x2="300" y2="450" stroke="#9A4D00" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <line x1="560" y1="392" x2="560" y2="450" stroke="#9A4D00" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <line x1="900" y1="328" x2="900" y2="450" stroke="#9A4D00" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="306" y="392" font-size="10" fill="#9A4D00">I5 eventos</text>
  <!-- Políticas → ONOS (I2, sólida, única orden directa) -->
  <path d="M 256 392 C 256 470, 480 470, 480 558" fill="none" stroke="#1E3A8A" stroke-width="2.2" marker-end="url(#arrO)"/>
  <text x="300" y="470" font-size="10.5" font-weight="bold" fill="#1E3A8A">I2 órdenes (síncrono, solo Políticas)</text>
  <!-- Monitor ⇄ ONOS (I8 contadores, dashed) -->
  <path d="M 574 328 C 574 400, 660 470, 660 558" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="656" y="420" font-size="10" fill="#0284C7">I8 contadores 5 s / 60 s</text>
  <!-- ONOS → Data plane (I1) -->
  <line x1="600" y1="606" x2="600" y2="632" stroke="#B91C1C" stroke-width="2.2" marker-end="url(#arrD)"/>
  <text x="610" y="626" font-size="10.5" font-weight="bold" fill="#B91C1C">I1 OpenFlow 1.3 · OOB ma1 · tcp 6653</text>
  <!-- Data plane → Activos -->
  <line x1="300" y1="738" x2="260" y2="782" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="900" y1="738" x2="900" y2="782" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <!-- Espejo → Suricata (dashed) -->
  <line x1="650" y1="828" x2="918" y2="810" stroke="#E15A50" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="740" y="840" font-size="10" fill="#B91C1C">espejo SPAN A4 p47 (solo RX)</text>

  <!-- ================= LATERAL DERECHO: FLUJO ================= -->
  <g>
    <rect x="1170" y="228" width="0" height="0" fill="none"/>
    <text x="980" y="250" font-size="11" font-weight="bold" fill="#1E3A8A" text-anchor="end">observar → detectar → decidir → traducir → ejecutar → verificar</text>
  </g>
</svg>
