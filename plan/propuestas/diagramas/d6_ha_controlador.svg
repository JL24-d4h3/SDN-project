<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B91C1C"/>
    </marker>
  </defs>

  <title>Alta disponibilidad del controlador: arquitectura de referencia</title>

  <text x="40" y="34" font-size="17" font-weight="bold" fill="#0F172A">Alta disponibilidad del controlador — ARQUITECTURA DE REFERENCIA (analizada, no desplegada)</text>
  <text x="40" y="54" font-size="11" fill="#64748B">El prototipo usa una sola instancia de ONOS; el clúster es la evolución de producción documentada (F-01 §6, C-04 §4)</text>

  <g>
    <rect x="140" y="90" width="180" height="70" rx="10" fill="#FBE4E2" stroke="#E15A50" stroke-width="1.8"/>
    <text x="230" y="120" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0F172A">ONOS-A</text>
    <text x="230" y="140" font-size="10.5" text-anchor="middle" fill="#7F1D1D">tcp:10.0.0.30:6653</text>

    <rect x="430" y="90" width="180" height="70" rx="10" fill="#FBE4E2" stroke="#E15A50" stroke-width="1.8"/>
    <text x="520" y="120" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0F172A">ONOS-B</text>
    <text x="520" y="140" font-size="10.5" text-anchor="middle" fill="#7F1D1D">tcp:10.0.0.31:6653</text>

    <rect x="720" y="90" width="180" height="70" rx="10" fill="#FBE4E2" stroke="#E15A50" stroke-width="1.8"/>
    <text x="810" y="120" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0F172A">ONOS-C</text>
    <text x="810" y="140" font-size="10.5" text-anchor="middle" fill="#7F1D1D">tcp:10.0.0.32:6653</text>

    <line x1="320" y1="125" x2="428" y2="125" stroke="#E15A50" stroke-width="2"/>
    <line x1="610" y1="125" x2="718" y2="125" stroke="#E15A50" stroke-width="2"/>
    <path d="M 320 110 C 520 40, 720 40, 900 110" fill="none" stroke="#E15A50" stroke-width="2"/>
    <text x="520" y="68" font-size="11" font-weight="bold" text-anchor="middle" fill="#B91C1C">consenso Raft (Atomix)</text>
  </g>

  <g stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="7,4" marker-end="url(#arr)">
    <line x1="230" y1="160" x2="430" y2="250"/>
    <line x1="520" y1="160" x2="520" y2="250"/>
    <line x1="810" y1="160" x2="610" y2="250"/>
  </g>

  <rect x="240" y="250" width="560" height="70" rx="10" fill="#D7EBD7" stroke="#3F7D3F" stroke-width="1.6"/>
  <text x="520" y="276" font-size="13" font-weight="bold" text-anchor="middle" fill="#0F172A">Switches Pica8 — varios endpoints configurados</text>
  <text x="520" y="296" font-size="10.5" text-anchor="middle" fill="#475569">un maestro (MASTER) por dispositivo, los demás en SLAVE · OFPT_ROLE_REQUEST con generation_id</text>
  <text x="520" y="312" font-size="10.5" text-anchor="middle" fill="#475569">ante la caída del maestro: re-elección → reconexión → reconciliación (reinstala lo faltante, no barre lo vigente)</text>

  <rect x="40" y="340" width="960" height="46" rx="10" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.3"/>
  <text x="520" y="358" font-size="11" text-anchor="middle" fill="#713F12">La red instalada continúa durante la caída: los switches conservan las reglas y sus timeouts (P2, P10).</text>
  <text x="520" y="374" font-size="11" text-anchor="middle" fill="#713F12">La redundancia del plano de datos sí se despliega (8 switches dual-homed); la del plano de control se documenta.</text>
</svg>
