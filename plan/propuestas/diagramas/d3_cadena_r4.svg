<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 430" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803D"/>
    </marker>
  </defs>

  <title>Cadena dinámica R4: observar, detectar, decidir, traducir, ejecutar, verificar</title>

  <text x="40" y="34" font-size="17" font-weight="bold" fill="#0F172A">La cadena R4 — detección y mitigación de DDoS/brute-force interno (bucle cerrado)</text>

  <!-- Cajas -->
  <g font-size="11">
    <rect x="40" y="60" width="130" height="96" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.3"/>
    <text x="105" y="84" font-weight="bold" text-anchor="middle" fill="#0F172A">Tráfico</text>
    <text x="105" y="104" font-size="10" text-anchor="middle" fill="#475569">ataque hacia</text>
    <text x="105" y="120" font-size="10" text-anchor="middle" fill="#475569">10.2.0.10</text>
    <text x="105" y="136" font-size="10" text-anchor="middle" fill="#475569">(legítimo +</text>
    <text x="105" y="150" font-size="10" text-anchor="middle" fill="#475569">malicioso)</text>

    <rect x="200" y="60" width="130" height="96" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.3"/>
    <text x="265" y="84" font-weight="bold" text-anchor="middle" fill="#0F172A">Contadores</text>
    <text x="265" y="102" font-size="10" text-anchor="middle" fill="#475569">OpenFlow</text>
    <text x="265" y="120" font-size="10" text-anchor="middle" fill="#475569">PORT / FLOW stats</text>
    <text x="265" y="138" font-size="10" text-anchor="middle" fill="#475569">vía ONOS (I8)</text>

    <rect x="360" y="60" width="130" height="96" rx="8" fill="#ffffff" stroke="#0284C7" stroke-width="1.4"/>
    <text x="425" y="84" font-weight="bold" text-anchor="middle" fill="#0F172A">Monitor</text>
    <text x="425" y="102" font-size="10" text-anchor="middle" fill="#475569">5 s caliente</text>
    <text x="425" y="118" font-size="10" text-anchor="middle" fill="#475569">60 s barrido</text>
    <text x="425" y="134" font-size="10" text-anchor="middle" fill="#475569">EWMA: μₜ, σₜ</text>
    <text x="425" y="150" font-size="10" text-anchor="middle" fill="#475569">α = 0.2</text>

    <rect x="520" y="60" width="130" height="96" rx="8" fill="#ffffff" stroke="#0284C7" stroke-width="1.4"/>
    <text x="585" y="84" font-weight="bold" text-anchor="middle" fill="#0F172A">Detección</text>
    <text x="585" y="102" font-size="10" text-anchor="middle" fill="#475569">umbral k=4σ</text>
    <text x="585" y="118" font-size="10" text-anchor="middle" fill="#475569">piso 200 pps</text>
    <text x="585" y="134" font-size="10" text-anchor="middle" fill="#475569">N=3 ventanas</text>
    <text x="585" y="150" font-size="10" text-anchor="middle" fill="#475569">(15 s · N=1 rápido)</text>

    <rect x="680" y="60" width="130" height="96" rx="8" fill="#ffffff" stroke="#0284C7" stroke-width="1.4"/>
    <text x="745" y="84" font-weight="bold" text-anchor="middle" fill="#0F172A">Incidentes</text>
    <text x="745" y="102" font-size="10" text-anchor="middle" fill="#475569">INC-xxxx</text>
    <text x="745" y="118" font-size="10" text-anchor="middle" fill="#475569">ABIERTO →</text>
    <text x="745" y="134" font-size="10" text-anchor="middle" fill="#475569">EN_MITIGACION</text>
    <text x="745" y="150" font-size="10" text-anchor="middle" fill="#475569">secuencia monótona</text>

    <rect x="840" y="60" width="130" height="96" rx="8" fill="#ffffff" stroke="#1E3A8A" stroke-width="1.6"/>
    <text x="905" y="84" font-weight="bold" text-anchor="middle" fill="#0F172A">Políticas</text>
    <text x="905" y="102" font-size="10" text-anchor="middle" fill="#475569">ABAC + escalera</text>
    <text x="905" y="118" font-size="10" text-anchor="middle" fill="#475569">RATE_LIMIT →</text>
    <text x="905" y="134" font-size="10" text-anchor="middle" fill="#475569">BLOCK → ISOLATE</text>
    <text x="905" y="150" font-size="10" text-anchor="middle" fill="#475569">única emisora I2</text>

    <rect x="1000" y="60" width="130" height="96" rx="8" fill="#FBE4E2" stroke="#E15A50" stroke-width="1.5"/>
    <text x="1065" y="84" font-weight="bold" text-anchor="middle" fill="#0F172A">ONOS</text>
    <text x="1065" y="102" font-size="10" text-anchor="middle" fill="#475569">I2 → OpenFlow</text>
    <text x="1065" y="118" font-size="10" text-anchor="middle" fill="#475569">cookie 0x02</text>
    <text x="1065" y="134" font-size="10" text-anchor="middle" fill="#475569">BARRIER</text>
    <text x="1065" y="150" font-size="10" text-anchor="middle" fill="#475569">confirmación</text>

    <rect x="1160" y="60" width="120" height="96" rx="8" fill="#D7EBD7" stroke="#3F7D3F" stroke-width="1.5"/>
    <text x="1220" y="84" font-weight="bold" text-anchor="middle" fill="#0F172A">Switch de</text>
    <text x="1220" y="100" font-weight="bold" text-anchor="middle" fill="#0F172A">ingreso</text>
    <text x="1220" y="118" font-size="10" text-anchor="middle" fill="#475569">METER 35 Mbps</text>
    <text x="1220" y="134" font-size="10" text-anchor="middle" fill="#475569">o DROP</text>
    <text x="1220" y="150" font-size="10" text-anchor="middle" fill="#475569">prioridad 1000</text>
  </g>

  <!-- Flechas de la cadena -->
  <g stroke="#334155" stroke-width="1.8" marker-end="url(#arr)">
    <line x1="170" y1="108" x2="198" y2="108"/>
    <line x1="330" y1="108" x2="358" y2="108"/>
    <line x1="490" y1="108" x2="518" y2="108"/>
    <line x1="650" y1="108" x2="678" y2="108"/>
    <line x1="810" y1="108" x2="838" y2="108"/>
    <line x1="970" y1="108" x2="998" y2="108"/>
    <line x1="1130" y1="108" x2="1158" y2="108"/>
  </g>

  <!-- Eventos sobre las flechas -->
  <g font-size="9.5" fill="#64748B" text-anchor="middle">
    <text x="265" y="58">MetricSample</text>
    <text x="425" y="58">AnomalyDetected</text>
    <text x="585" y="58">IncidentOpened</text>
    <text x="745" y="58">MitigationRequired (eco al bus)</text>
    <text x="905" y="58">orden I2 síncrona</text>
    <text x="1065" y="58">FLOW_MOD / METER_MOD</text>
  </g>

  <!-- Verificación (retroalimentación) -->
  <path d="M 1220 156 C 1220 240, 425 240, 425 158" fill="none" stroke="#15803D" stroke-width="1.8" stroke-dasharray="7,4" marker-end="url(#arrG)"/>
  <text x="822" y="248" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle">MitigationVerified — el Monitor mide el tráfico real en la siguiente ventana (5 s)</text>
  <text x="822" y="266" font-size="10" fill="#15803D" text-anchor="middle">la regla instalada no es la mitigación efectiva: solo la verificación lo confirma (900 Mbps → 35 Mbps)</text>

  <!-- Fases -->
  <g>
    <rect x="200" y="300" width="290" height="34" rx="6" fill="#E1EDFA" stroke="#9CC3E5"/>
    <text x="345" y="321" font-size="12" font-weight="bold" text-anchor="middle" fill="#1E3A8A">OBSERVAR</text>
    <rect x="520" y="300" width="290" height="34" rx="6" fill="#E1EDFA" stroke="#9CC3E5"/>
    <text x="665" y="321" font-size="12" font-weight="bold" text-anchor="middle" fill="#1E3A8A">DETECTAR</text>
    <rect x="840" y="300" width="290" height="34" rx="6" fill="#FBE8D0" stroke="#F5AA50"/>
    <text x="985" y="321" font-size="12" font-weight="bold" text-anchor="middle" fill="#9A4D00">DECIDIR</text>
    <rect x="1000" y="360" width="280" height="34" rx="6" fill="#FBE4E2" stroke="#E15A50"/>
    <text x="1140" y="381" font-size="12" font-weight="bold" text-anchor="middle" fill="#B91C1C">TRADUCIR + EJECUTAR</text>
    <rect x="200" y="360" width="290" height="34" rx="6" fill="#D7EBD7" stroke="#7BAE7B"/>
    <text x="345" y="381" font-size="12" font-weight="bold" text-anchor="middle" fill="#166534">VERIFICAR (bucle cerrado)</text>
  </g>

  <!-- Presupuesto temporal -->
  <g>
    <text x="40" y="418" font-size="11" fill="#334155"><tspan font-weight="bold">T_mitigate = T_detect + T_event + T_policy + T_I2 + T_OF + T_ASIC</tspan>  ≈  15 s + 0.185 s ≈ 15.2 s (patrón lento N=3) · ≈ 5.2 s (vía rápida N=1) — presupuesto de diseño, se mide en el prototipo</text>
  </g>
</svg>
