<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="Arial, Helvetica, sans-serif">
  <title>Despliegue agrupado por afinidad: co-locación sin acoplamiento lógico</title>

  <text x="40" y="34" font-size="17" font-weight="bold" fill="#0F172A">Despliegue agrupado por afinidad — la lógica no se fusiona, solo se co-localiza</text>
  <text x="40" y="54" font-size="11" fill="#64748B">Los diez servicios siguen siendo procesos distintos con fronteras intactas; los contenedores pueden co-localizarse por afinidad operacional (de partida: un contenedor por servicio).</text>

  <rect x="40" y="76" width="1160" height="400" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.8"/>
  <text x="620" y="100" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0F172A">SERVIDOR DEL LABORATORIO — hipervisor KVM/libvirt · ≥ 32 GB RAM</text>

  <!-- Host identidad -->
  <rect x="70" y="120" width="340" height="150" rx="10" fill="#E1EDFA" stroke="#3B6E9E" stroke-width="1.4"/>
  <text x="240" y="142" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1E3A8A">HOST DE IDENTIDAD</text>
  <g font-size="11" fill="#0F172A">
    <rect x="88" y="154" width="140" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="158" y="178" text-anchor="middle">Portal (.5)</text>
    <rect x="240" y="154" width="152" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="316" y="178" text-anchor="middle">IAM/AAA (.10)</text>
    <rect x="88" y="204" width="140" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="158" y="228" text-anchor="middle">Registro (.11)</text>
    <rect x="240" y="204" width="152" height="40" rx="6" fill="#FBE8D0" stroke="#F5AA50"/><text x="316" y="222" text-anchor="middle">IdP: FreeRADIUS</text>
    <text x="316" y="236" text-anchor="middle">+ OpenLDAP (.23/.24)</text>
  </g>

  <!-- Host observabilidad -->
  <rect x="430" y="120" width="340" height="150" rx="10" fill="#E1EDFA" stroke="#3B6E9E" stroke-width="1.4"/>
  <text x="600" y="142" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1E3A8A">HOST DE OBSERVABILIDAD</text>
  <g font-size="11" fill="#0F172A">
    <rect x="448" y="154" width="140" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="518" y="178" text-anchor="middle">Monitor (.12)</text>
    <rect x="600" y="154" width="152" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="676" y="178" text-anchor="middle">Detección (.13)</text>
    <rect x="448" y="204" width="140" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="518" y="228" text-anchor="middle">Adaptador (.18)</text>
    <rect x="600" y="204" width="152" height="40" rx="6" fill="#FBE8D0" stroke="#F5AA50"/><text x="676" y="228" text-anchor="middle">Grafana (.26)</text>
  </g>

  <!-- Host respuesta -->
  <rect x="790" y="120" width="340" height="150" rx="10" fill="#E1EDFA" stroke="#3B6E9E" stroke-width="1.4"/>
  <text x="960" y="142" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1E3A8A">HOST DE RESPUESTA</text>
  <g font-size="11" fill="#0F172A">
    <rect x="808" y="154" width="140" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="878" y="178" text-anchor="middle">Incidentes (.14)</text>
    <rect x="960" y="154" width="152" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="1036" y="178" text-anchor="middle">Políticas (.15)</text>
    <text x="960" y="222" font-size="10" fill="#64748B" text-anchor="middle">única emisora de órdenes I2</text>
  </g>

  <!-- Host gobierno -->
  <rect x="70" y="290" width="340" height="150" rx="10" fill="#E1EDFA" stroke="#3B6E9E" stroke-width="1.4"/>
  <text x="240" y="312" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1E3A8A">HOST DE GOBIERNO</text>
  <g font-size="11" fill="#0F172A">
    <rect x="88" y="324" width="140" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="158" y="348" text-anchor="middle">Auditoría (.16)</text>
    <rect x="240" y="324" width="152" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="316" y="348" text-anchor="middle">Consola (.17)</text>
    <text x="240" y="392" font-size="10" fill="#64748B" text-anchor="middle">export JSONL con cadena SHA-256</text>
  </g>

  <!-- Infraestructura -->
  <rect x="430" y="290" width="700" height="150" rx="10" fill="#FBE8D0" stroke="#F5AA50" stroke-width="1.4"/>
  <text x="780" y="312" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#9A4D00">INFRAESTRUCTURA (papel → producto)</text>
  <g font-size="11" fill="#0F172A">
    <rect x="448" y="326" width="160" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="528" y="350" text-anchor="middle">ONOS 2.7 (.20)</text>
    <rect x="620" y="326" width="160" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="700" y="350" text-anchor="middle">RabbitMQ 3.13 (.21)</text>
    <rect x="792" y="326" width="160" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="872" y="350" text-anchor="middle">PostgreSQL 16 (.22)</text>
    <rect x="964" y="326" width="148" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="1038" y="350" text-anchor="middle">chrony (.25)</text>
    <rect x="448" y="376" width="160" height="40" rx="6" fill="#ffffff" stroke="#94A3B8"/><text x="528" y="400" text-anchor="middle">DNS dnsmasq (.28)</text>
    <text x="780" y="404" font-size="10" fill="#9A4D00" text-anchor="middle">una base PostgreSQL por servicio (bd_iam, bd_registro, bd_monitor, bd_incidentes, bd_politicas, bd_auditoria)</text>
  </g>

  <!-- VM sensor -->
  <rect x="70" y="500" width="1090" height="80" rx="10" fill="#FBE4E2" stroke="#A33B33" stroke-width="1.5"/>
  <text x="615" y="526" font-size="13" font-weight="bold" text-anchor="middle" fill="#B91C1C">VM SENSOR PERIMETRAL — Suricata 7 · 10.0.0.27 · 2 NIC: espejo RX (sin IP, desde A4 p47) + gestión</text>
  <text x="615" y="548" font-size="11" text-anchor="middle" fill="#7F1D1D">fuera del camino de reenvío (P8): su caída degrada R5 pero no corta el plano de datos · alertas eve.json → Adaptador (.18) → bus</text>

  <text x="40" y="608" font-size="10.5" fill="#64748B">Agrupación sujeta a CPU/RAM y pruebas de carga. La independencia de despliegue es una capacidad: IAM y Registro pueden vivir en el mismo host sin dejar de ser servicios distintos — la misma descomposición que un despliegue en nube heredaría sin cambios.</text>
</svg>
