<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B91C1C"/>
    </marker>
  </defs>

  <title>Topología física del prototipo: 8 switches, 13 enlaces, plano de puertos y canal OOB</title>

  <text x="40" y="32" font-size="17" font-weight="bold" fill="#0F172A">Topología física del prototipo — 8 switches Pica8 · 13 enlaces dual-homed</text>

  <!-- Leyenda VLAN -->
  <g>
    <rect x="930" y="20" width="60" height="22" rx="5" fill="#E1EDFA" stroke="#64748B"/><text x="960" y="35" font-size="11" text-anchor="middle" fill="#0F172A">VLAN 10</text>
    <rect x="1000" y="20" width="60" height="22" rx="5" fill="#FBE8D0" stroke="#64748B"/><text x="1030" y="35" font-size="11" text-anchor="middle" fill="#0F172A">VLAN 20</text>
    <rect x="1070" y="20" width="60" height="22" rx="5" fill="#D7EBD7" stroke="#64748B"/><text x="1100" y="35" font-size="11" text-anchor="middle" fill="#0F172A">VLAN 30</text>
    <rect x="1140" y="20" width="60" height="22" rx="5" fill="#FBE4E2" stroke="#64748B"/><text x="1170" y="35" font-size="11" text-anchor="middle" fill="#0F172A">VLAN 40</text>
    <text x="930" y="60" font-size="10" fill="#64748B">trunks entre switches: 10/20/30/40 tagged (802.1Q)</text>
  </g>

  <!-- Núcleo -->
  <g>
    <rect x="470" y="80" width="130" height="50" rx="8" fill="#D7EBD7" stroke="#3F7D3F" stroke-width="1.6"/>
    <text x="535" y="102" font-size="13" font-weight="bold" text-anchor="middle" fill="#0F172A">NC1</text>
    <text x="535" y="118" font-size="10" text-anchor="middle" fill="#3F7D3F">núcleo</text>
    <rect x="700" y="80" width="130" height="50" rx="8" fill="#D7EBD7" stroke="#3F7D3F" stroke-width="1.6"/>
    <text x="765" y="102" font-size="13" font-weight="bold" text-anchor="middle" fill="#0F172A">NC2</text>
    <text x="765" y="118" font-size="10" text-anchor="middle" fill="#3F7D3F">núcleo</text>
    <line x1="600" y1="105" x2="700" y2="105" stroke="#3F7D3F" stroke-width="2.6"/>
    <text x="650" y="96" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#3F7D3F">NC1 p3 ↔ NC2 p3</text>
    <text x="650" y="124" font-size="9.5" text-anchor="middle" fill="#64748B">enlace inter-núcleo</text>
  </g>

  <!-- Distribución -->
  <g>
    <rect x="430" y="210" width="130" height="50" rx="8" fill="#E1EDFA" stroke="#3B6E9E" stroke-width="1.6"/>
    <text x="495" y="232" font-size="13" font-weight="bold" text-anchor="middle" fill="#0F172A">D1</text>
    <text x="495" y="248" font-size="10" text-anchor="middle" fill="#3B6E9E">distribución</text>
    <rect x="700" y="210" width="130" height="50" rx="8" fill="#E1EDFA" stroke="#3B6E9E" stroke-width="1.6"/>
    <text x="765" y="232" font-size="13" font-weight="bold" text-anchor="middle" fill="#0F172A">D2</text>
    <text x="765" y="248" font-size="10" text-anchor="middle" fill="#3B6E9E">distribución</text>

    <line x1="480" y1="210" x2="515" y2="130" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="452" y="160" font-size="9.5" fill="#334155">D1 p1 ↔ NC1 p1</text>
    <line x1="515" y1="210" x2="735" y2="130" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="600" y="155" font-size="9.5" fill="#334155">D1 p2 ↔ NC2 p1</text>
    <line x1="790" y1="210" x2="555" y2="130" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="640" y="176" font-size="9.5" fill="#334155">D2 p1 ↔ NC1 p2</text>
    <line x1="750" y1="210" x2="750" y2="130" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="758" y="180" font-size="9.5" fill="#334155">D2 p2 ↔ NC2 p2</text>
  </g>

  <!-- Acceso -->
  <g>
    <rect x="90" y="330" width="180" height="50" rx="8" fill="#E1EDFA" stroke="#3B6E9E" stroke-width="1.6"/>
    <text x="180" y="352" font-size="13" font-weight="bold" text-anchor="middle" fill="#0F172A">A1</text>
    <text x="180" y="368" font-size="10" text-anchor="middle" fill="#3B6E9E">acceso · usuarios</text>
    <rect x="320" y="330" width="180" height="50" rx="8" fill="#E1EDFA" stroke="#3B6E9E" stroke-width="1.6"/>
    <text x="410" y="352" font-size="13" font-weight="bold" text-anchor="middle" fill="#0F172A">A2</text>
    <text x="410" y="368" font-size="10" text-anchor="middle" fill="#3B6E9E">acceso · usuarios</text>
    <rect x="550" y="330" width="180" height="50" rx="8" fill="#D7EBD7" stroke="#3F7D3F" stroke-width="1.6"/>
    <text x="640" y="352" font-size="13" font-weight="bold" text-anchor="middle" fill="#0F172A">A3</text>
    <text x="640" y="368" font-size="10" text-anchor="middle" fill="#3F7D3F">acceso · servidores + gestión</text>
    <rect x="780" y="330" width="180" height="50" rx="8" fill="#FBE4E2" stroke="#A33B33" stroke-width="1.6"/>
    <text x="870" y="352" font-size="13" font-weight="bold" text-anchor="middle" fill="#0F172A">A4</text>
    <text x="870" y="368" font-size="10" text-anchor="middle" fill="#A33B33">acceso · borde (VLAN 40)</text>

    <!-- uplinks de acceso: p1 → D1, p2 → D2 -->
    <line x1="160" y1="330" x2="440" y2="260" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="260" y="292" font-size="9.5" fill="#334155">A1 p1 ↔ D1 p3</text>
    <line x1="210" y1="330" x2="740" y2="260" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="330" y="282" font-size="9.5" fill="#334155">A1 p2 ↔ D2 p3</text>
    <line x1="390" y1="330" x2="470" y2="260" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="404" y="292" font-size="9.5" fill="#334155">A2 p1 ↔ D1 p4</text>
    <line x1="440" y1="330" x2="770" y2="260" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="560" y="292" font-size="9.5" fill="#334155">A2 p2 ↔ D2 p4</text>
    <line x1="620" y1="330" x2="500" y2="260" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="520" y="312" font-size="9.5" fill="#334155">A3 p1 ↔ D1 p5</text>
    <line x1="660" y1="330" x2="800" y2="260" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="700" y="312" font-size="9.5" fill="#334155">A3 p2 ↔ D2 p5</text>
    <line x1="840" y1="330" x2="530" y2="260" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="700" y="272" font-size="9.5" fill="#334155">A4 p1 ↔ D1 p6</text>
    <line x1="890" y1="330" x2="830" y2="260" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="906" y="282" font-size="9.5" fill="#334155">A4 p2 ↔ D2 p6</text>
  </g>

  <!-- Plano de puertos por acceso -->
  <g font-size="10.5" fill="#334155">
    <rect x="90" y="400" width="180" height="120" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="180" y="416" font-size="11" font-weight="bold" text-anchor="middle" fill="#0F172A">A1 · VLAN 10 untagged</text>
    <text x="98" y="436">p3–p19: equipos físicos</text>
    <text x="98" y="454">p20 → NIC-B:</text>
    <text x="98" y="470">16 hosts académicos</text>
    <text x="98" y="486">10.1.0.10–.25</text>
    <text x="98" y="506" fill="#B91C1C">ma1 → canal OOB</text>

    <rect x="320" y="400" width="180" height="120" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="410" y="416" font-size="11" font-weight="bold" text-anchor="middle" fill="#0F172A">A2 · VLAN 10 untagged</text>
    <text x="328" y="436">p3–p5: equipos físicos</text>
    <text x="328" y="454">p6 → NIC-E:</text>
    <text x="328" y="470">operadores .30–.31</text>
    <text x="328" y="486">atacante interno .50</text>
    <text x="328" y="502">puente demo MAC_Moved</text>
    <text x="328" y="516" fill="#B91C1C">ma1 → canal OOB</text>

    <rect x="550" y="400" width="180" height="120" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="640" y="416" font-size="11" font-weight="bold" text-anchor="middle" fill="#0F172A">A3 · VLAN 30 untagged</text>
    <text x="558" y="436">p3: Servicio General .10</text>
    <text x="558" y="452">p4: Privilegiado .11</text>
    <text x="558" y="468">p5: Crítico (BD) .12</text>
    <text x="558" y="484">p6 → NIC-A:</text>
    <text x="558" y="500" fill="#9A4D00">trunk VLAN 20 (gestión)</text>
    <text x="558" y="516" fill="#B91C1C">ma1 → canal OOB</text>

    <rect x="780" y="400" width="180" height="120" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="870" y="416" font-size="11" font-weight="bold" text-anchor="middle" fill="#0F172A">A4 · VLAN 40</text>
    <text x="788" y="436">p3: acceso externo</text>
    <text x="788" y="452">p4 → NIC-C:</text>
    <text x="788" y="468">VM atacante externo</text>
    <text x="788" y="484">10.3.0.10</text>
    <text x="788" y="500" fill="#B91C1C">p47 → NIC-D: ESPEJO</text>
    <text x="788" y="516" fill="#B91C1C">ma1 → canal OOB</text>
  </g>

  <!-- Servidor -->
  <g>
    <rect x="90" y="560" width="870" height="150" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/>
    <text x="525" y="584" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0F172A">SERVIDOR DEL LABORATORIO — hipervisor KVM/libvirt · ≥ 32 GB RAM · 24 VMs + contenedores</text>
    <rect x="110" y="600" width="156" height="92" rx="7" fill="#ffffff" stroke="#9A4D00" stroke-width="1.3"/>
    <text x="188" y="618" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#713F12">NIC-A</text>
    <text x="188" y="634" font-size="9.8" text-anchor="middle" fill="#475569">trunk VLAN 20</text>
    <text x="188" y="650" font-size="9.8" text-anchor="middle" fill="#475569">plano de contenedores</text>
    <text x="188" y="666" font-size="9.8" text-anchor="middle" fill="#475569">(10 servicios + infra)</text>
    <rect x="286" y="600" width="156" height="92" rx="7" fill="#ffffff" stroke="#3B6E9E" stroke-width="1.3"/>
    <text x="364" y="618" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1E3A8A">NIC-B</text>
    <text x="364" y="634" font-size="9.8" text-anchor="middle" fill="#475569">16 VMs académicas</text>
    <text x="364" y="650" font-size="9.8" text-anchor="middle" fill="#475569">10.1.0.10–.25</text>
    <text x="364" y="666" font-size="9.8" text-anchor="middle" fill="#475569">52:54:00:01:xx</text>
    <rect x="462" y="600" width="156" height="92" rx="7" fill="#ffffff" stroke="#A33B33" stroke-width="1.3"/>
    <text x="540" y="618" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#B91C1C">NIC-C</text>
    <text x="540" y="634" font-size="9.8" text-anchor="middle" fill="#475569">VM atacante externo</text>
    <text x="540" y="650" font-size="9.8" text-anchor="middle" fill="#475569">10.3.0.10</text>
    <text x="540" y="666" font-size="9.8" text-anchor="middle" fill="#475569">VLAN 40 tagged</text>
    <rect x="638" y="600" width="156" height="92" rx="7" fill="#ffffff" stroke="#A33B33" stroke-width="1.3"/>
    <text x="716" y="618" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#B91C1C">NIC-D</text>
    <text x="716" y="634" font-size="9.8" text-anchor="middle" fill="#475569">espejo, SOLO RX</text>
    <text x="716" y="650" font-size="9.8" text-anchor="middle" fill="#475569">entregada a la VM</text>
    <text x="716" y="666" font-size="9.8" text-anchor="middle" fill="#475569">del sensor Suricata</text>
    <rect x="814" y="600" width="130" height="92" rx="7" fill="#ffffff" stroke="#3B6E9E" stroke-width="1.3"/>
    <text x="879" y="618" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1E3A8A">NIC-E</text>
    <text x="879" y="634" font-size="9.8" text-anchor="middle" fill="#475569">operadores .30–.31</text>
    <text x="879" y="650" font-size="9.8" text-anchor="middle" fill="#475569">atacante interno .50</text>
    <text x="879" y="666" font-size="9.8" text-anchor="middle" fill="#475569">puente MAC_Moved</text>
  </g>

  <!-- Flechas NIC → puertos -->
  <g stroke="#334155" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="188" y1="600" x2="625" y2="520" stroke-dasharray="6,4"/>
    <line x1="364" y1="600" x2="200" y2="520" stroke-dasharray="6,4"/>
    <line x1="540" y1="600" x2="845" y2="520" stroke-dasharray="6,4"/>
    <line x1="879" y1="600" x2="420" y2="520" stroke-dasharray="6,4"/>
  </g>
  <g font-size="9.8" fill="#334155">
    <text x="470" y="548">NIC-A ↔ A3 p6 (trunk VLAN 20)</text>
    <text x="250" y="548">NIC-B ↔ A1 p20 (VLAN 10)</text>
    <text x="740" y="548">NIC-C ↔ A4 p4 (VLAN 40)</text>
    <text x="560" y="600" transform="rotate(0)">NIC-E ↔ A2 p6 (VLAN 10)</text>
  </g>

  <!-- Espejo: A4 p47 → NIC-D -->
  <line x1="870" y1="500" x2="716" y2="598" stroke="#B91C1C" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <text x="838" y="556" font-size="10" font-weight="bold" fill="#B91C1C">A4 p47 → espejo (RX)</text>

  <!-- OOB -->
  <g>
    <rect x="90" y="740" width="870" height="66" rx="10" fill="#FBE4E2" stroke="#A33B33" stroke-width="1.5"/>
    <text x="525" y="764" font-size="13" font-weight="bold" text-anchor="middle" fill="#B91C1C">CANAL DE CONTROL OUT-OF-BAND — separado físicamente del plano de datos</text>
    <text x="525" y="784" font-size="11" text-anchor="middle" fill="#7F1D1D">ma1 × 8 (una por switch) → switch de gestión aislado → ONOS 10.0.0.20:6653 · OpenFlow 1.3</text>
    <text x="525" y="798" font-size="10" text-anchor="middle" fill="#7F1D1D">whitelist del controlador · latido ECHO cada 5 s · los flujos OpenFlow jamás circulan por la VLAN 20</text>
  </g>
  <g stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="180" y1="380" x2="180" y2="404"/>
    <line x1="410" y1="380" x2="410" y2="404"/>
    <line x1="640" y1="380" x2="640" y2="404"/>
    <line x1="870" y1="380" x2="870" y2="404"/>
    <line x1="495" y1="260" x2="495" y2="404"/>
    <line x1="765" y1="260" x2="765" y2="404"/>
    <line x1="535" y1="130" x2="535" y2="404"/>
    <line x1="765" y1="130" x2="765" y2="404"/>
  </g>

  <!-- Contadores -->
  <g>
    <text x="980" y="300" font-size="11" font-weight="bold" fill="#0F172A">Resumen</text>
    <text x="980" y="322" font-size="10.5" fill="#334155">• 8 switches Pica8: 2 núcleo, 2 distribución, 4 acceso</text>
    <text x="980" y="342" font-size="10.5" fill="#334155">• 13 enlaces inter-switch (8 acceso-distribución +</text>
    <text x="992" y="358" font-size="10.5" fill="#334155">4 distribución-núcleo + 1 inter-núcleo)</text>
    <text x="980" y="378" font-size="10.5" fill="#334155">• todo acceso dual-homed: p1 → D1, p2 → D2</text>
    <text x="980" y="398" font-size="10.5" fill="#334155">• espejo perimetral: A4 p47 → NIC-D (solo RX)</text>
    <text x="980" y="418" font-size="10.5" fill="#334155">• OOB: ma1 × 8, medio físico separado</text>
    <text x="980" y="438" font-size="10.5" fill="#334155">• convención de MAC: 52:54:00:xx:yy</text>
  </g>
</svg>
