[project]
name = "sdn-common"
version = "0.1.0"
description = "Esqueleto compartido por los servicios de campus-sdn"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pika",
    "uuid6",
    "jsonschema",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sdn_common*"]
