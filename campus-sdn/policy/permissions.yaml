# Política de permisos de la plataforma
# Fuente de verdad de roles, perfiles, permisos, condiciones y asignaciones.
# La matriz Rol x Permiso se genera desde este archivo.
# Versión: 3.0 — Etapa 0 cerrada (2026-10-28); ajustes 2026-10-31:
#   - recurso_red entra al catálogo de tipos (usado por P04 y R002)
#   - hard_constraints: el campo 'permission' pasa a 'requires'
#   - valores de dominio a inglés (roles, tipos, estados, obligaciones);
#     la correspondencia con el corpus en español está en policy/README.md

version: 3
name: permisos-plataforma-sdn
description: >
  Modelo de autorización de la solución SDN. Cubre el plano de servicios
  (RBAC con condiciones) y el plano de red (perfiles ABAC). No contiene
  secretos ni credenciales.

defaults:
  effect: deny
  deny_overrides: true
  fail_safe: deny
  audit: true
  require_session: true
  require_security_state: true

# ---------------------------------------------------------------------------
# Roles
# ---------------------------------------------------------------------------

roles:
  academic:
    name: Academic
    level: 0
    population: estudiantes y docentes
    identity_source: institutional_idp
    mfa_required: false
    privileged_session: false

  it_specialist:
    name: IT Operator
    level: 1
    population: soporte y operación de servicios
    identity_source: own_repository
    mfa_required: true
    privileged_session: true

  network_admin:
    name: Network Administrator
    level: 2
    population: operación de la red y del controlador
    identity_source: own_repository
    mfa_required: true
    privileged_session: true

  super_admin:
    name: Super Administrator
    level: 3
    population: gobierno de la plataforma
    identity_source: own_repository
    mfa_required: true
    privileged_session: true

# ---------------------------------------------------------------------------
# Perfiles de red
# ---------------------------------------------------------------------------

profiles:
  base:
    name: BASE
    type: fixed
    auth_required: false
    scope: [portal, dhcp, dns]
    priority:
      portal: 150
      dhcp_dns: 10
    notes: >
      Esqueleto pre-sesión. Deny by default hacia la red de gestión.

  academic:
    name: ACADEMIC
    type: fixed
    auth_required: true
    scope: [academic_services, internet]
    priority:
      session: 190
    notes: >
      Valor provisional de pruebas. El valor de despliegue se fija con la
      medición de access/02 §3; debe quedar entre portal (150) y sesión
      privilegiada (200).

  it_operator:
    name: IT_OPERATOR
    type: derived
    from_role: it_specialist
    scope: [console, security_api]
    priority:
      session: 200

  admin_operator:
    name: ADMINISTRATOR_OPERATOR
    type: derived
    from_role: network_admin
    scope: [management_network]
    priority:
      session: 200

  sa_operator:
    name: SUPER_ADMINISTRATOR_OPERATOR
    type: derived
    from_role: super_admin
    scope: [management_network, remote_access]
    priority:
      session: 200

  elevation:
    name: ELEVATION
    type: parameterized
    params: [scope, ttl_s]
    requires: [P28, P29]
    priority:
      session: 200
    instances:
      laboratory:
        scope: laboratory
        ttl_s: 1800
        notes: >
          LABORATORIO es una instancia de ELEVACIÓN, no un perfil fijo.

# Alias documentales conservados por compatibilidad.
profile_aliases:
  IT: it_operator
  NETWORK_ADMIN: admin_operator
  SUPER_ADMIN: sa_operator

# ---------------------------------------------------------------------------
# Recursos
# ---------------------------------------------------------------------------

resources:
  catalog: docs/fases/A-Modelo_de_dominio/02_recursos_y_servicios.md
  types:
    - academic_service
    - public_service
    - security_service
    - own_resource
    - security_resource
    - network_resource
    - alert
    - network_alert
    - incident
    - network_incident
    - security_log
    - operational_log
    - event
    - metric
    - traffic
    - management_network
    - switch
    - sdn_controller
    - network_device
    - segment
    - vlan
    - network_rule
    - flow
    - access_policy
    - profile
    - security_policy
    - detection_rule
    - mitigation_rule
    - mitigation
    - ids
    - ips
    - detection
    - node
    - detection_threshold
    - threshold_range
    - local_account
    - local_it_account
    - administrative_account
    - administrative_it_account
    - role
    - permission
    - elevation_request
    - critical_action_request
    - device_registration_request
    - privileged_device
    - privileged_it_device
    - session
    - audit
    - global_configuration
    - platform
    - configuration
    - key_certificate
    - console
    - security_api
    - network_api
    - network_operation
    - authorized_response

# ---------------------------------------------------------------------------
# Condiciones
# ---------------------------------------------------------------------------

conditions:
  C1:
    name: Scope
    description: El recurso pertenece al ámbito asignado al rol.
    predicate: resource.scope == subject.scope
    on_failure: deny

  C2:
    name: Active delegation
    description: Existe una delegación explícita, con alcance y vigencia.
    predicate: delegation.exists(subject, permission, resource) and delegation.valid_now
    on_failure: deny

  C3:
    name: Approved range
    description: El valor o la acción está dentro del rango aprobado.
    predicate: action.value within policy.approved_range
    on_failure: deny

  C4:
    name: Separation of duties
    description: El solicitante es distinto del aprobador.
    predicate: request.requester_id != approval.approver_id
    on_failure: deny

  C5:
    name: Privileged session
    description: MFA verificado, dispositivo registrado y canal de gestión.
    predicate: session.mfa_verified and device.registered and channel in [console, api]
    on_failure: step_up

  C6:
    name: Security state
    description: Sin compromiso, cuarentena o incidente que impida la acción.
    type: hard_gate
    evaluator: security_state_gate
    on_failure: deny

  C7:
    name: Low impact
    description: La severidad no supera el umbral; si lo supera, se exige P32.
    predicate: action.severity <= policy.impact_threshold
    on_failure: step_up

  C8:
    name: Own session
    description: El sujeto solo opera sus propias sesiones.
    predicate: resource.session.subject_id == subject.id
    on_failure: deny

  C9:
    name: Authorized resource
    description: El tipo y la instancia del recurso están en la lista del rol.
    predicate: resource.type in assignment.resources and resource.id in subject.allowed_resources
    on_failure: deny

  C10:
    name: Allowed context
    description: >
      Ventana, ubicación y canal permitidos. La configuración crítica exige
      ventana de mantenimiento o emergencia declarada.
    predicate: >
      context.time_window in [maintenance, emergency] and
      context.location in [campus, vpn]
    on_failure: deny

  C11:
    name: Read-only
    description: El rol puede consultar y ejecutar operaciones autorizadas, no configurar.
    predicate: action.verb in [read, list, get, status, dump_flows]
    on_failure: deny

# ---------------------------------------------------------------------------
# Estados de seguridad
# ---------------------------------------------------------------------------

security_states:
  subject:
    normal:
      blocks_all: false
      blocks_privileged: false
    suspicious:
      blocks_all: false
      blocks_privileged: false
      requires_step_up: true
    compromised:
      blocks_all: false
      blocks_privileged: true
      allows_response: true
    quarantine:
      blocks_all: true
      allows_portal: true
      allows_remediation: true
    suspended:
      blocks_all: true

  environment:
    normal:
      blocks: []
    active_incident:
      high_impact_requires: P32
    isolated_segment:
      blocks_segment: true
      allows_response: true
    emergency_mode:
      allows_emergency: true
      requires_audit: true
    maintenance:
      allows_planned_changes: true

  hard_constraints:
    - id: HC-01
      description: Sujeto comprometido, en cuarentena o suspendido no recibe permisos privilegiados.
      subject_states: [compromised, quarantine, suspended]
      effect: deny
      except: [response, remediation, portal]
    - id: HC-02
      description: Segmento aislado no recibe tráfico de usuarios.
      environment_states: [isolated_segment]
      effect: deny
      except: [response]
    - id: HC-03
      description: Incidente activo exige P32 para acciones de alto impacto.
      environment_states: [active_incident]
      effect: step_up
      requires: P32
    - id: HC-04
      description: Sujeto sospechoso exige step-up en acciones privilegiadas.
      subject_states: [suspicious]
      effect: step_up
      requires: C5

# ---------------------------------------------------------------------------
# Permisos
# ---------------------------------------------------------------------------

permissions:
  P01:
    name: Authenticate
    plane: pre_session
    verb: authenticate
    resource_types: [session]
    description: Iniciar sesión y acreditar identidad ante la plataforma.

  P02:
    name: Access the network
    plane: network
    verb: network_access
    resource_types: [profile]
    description: Solicitar el perfil de red que corresponde al sujeto, dispositivo y contexto.

  P03:
    name: Access service
    plane: services
    verb: access
    resource_types: [academic_service, public_service, security_service, console, security_api, network_api]
    description: Entrar a un servicio o a su API.

  P04:
    name: Read resource
    plane: services
    verb: read
    resource_types: [own_resource, security_resource, alert, incident, security_log, operational_log, metric, network_resource, switch, sdn_controller, access_policy]
    description: Leer el estado o el contenido de un recurso autorizado.

  P05:
    name: Execute operation
    plane: services
    verb: execute
    resource_types: [academic_service, authorized_response, network_operation]
    description: Ejecutar una operación funcional del servicio.

  P06:
    name: Read network status
    plane: services
    verb: read_status
    resource_types: [management_network, switch, sdn_controller]
    description: Consultar topología, estado de switches y estado del controlador.

  P07:
    name: Read traffic
    plane: services
    verb: read_traffic
    resource_types: [traffic, metric]
    description: Consultar métricas y tráfico observado.

  P08:
    name: Read events and logs
    plane: services
    verb: read_logs
    resource_types: [security_log, operational_log, event]
    description: Consultar eventos y registros operativos o de seguridad.

  P09:
    name: Read alerts
    plane: services
    verb: read_alerts
    resource_types: [alert, network_alert]
    description: Consultar alertas de detección y de red.

  P10:
    name: Analyze incident
    plane: services
    verb: analyze
    resource_types: [incident, network_incident, alert, security_log]
    description: Analizar un incidente y su evidencia.

  P11:
    name: Manage alert
    plane: services
    verb: manage_alert
    resource_types: [alert, network_alert, incident, network_incident]
    description: Clasificar, reconocer o cerrar una alerta.

  P12:
    name: Execute mitigation
    plane: services
    verb: mitigate
    resource_types: [mitigation, node]
    description: Ejecutar una mitigación sobre un nodo o un flujo.

  P13:
    name: Isolate node
    plane: services
    verb: isolate
    resource_types: [node, segment]
    description: Aislar un nodo o un segmento de la red.

  P14:
    name: Manage local accounts
    plane: services
    verb: manage_local_account
    resource_types: [local_account, local_it_account]
    description: >
      Crear, modificar o desactivar cuentas locales de la plataforma.
      Excluye identidades institucionales, break-glass y cuentas de
      Superadministrador.

  P15:
    name: Assign role
    plane: services
    verb: assign_role
    resource_types: [role, administrative_account]
    description: Asignar o retirar roles a identidades.

  P16:
    name: Manage permissions
    plane: services
    verb: manage_permission
    resource_types: [permission, role]
    description: Modificar la matriz de permisos y las condiciones.

  P17:
    name: Manage access policies
    plane: services
    verb: manage_access_policy
    resource_types: [access_policy, profile]
    description: Definir qué perfil de red corresponde a cada caso.

  P18:
    name: Manage security policies
    plane: services
    verb: manage_security_policy
    resource_types: [security_policy, detection_rule, mitigation_rule]
    description: Definir reglas de detección y mitigación.

  P19:
    name: Manage network rules
    plane: services
    verb: manage_network_rule
    resource_types: [network_rule, flow]
    description: Crear, modificar o retirar reglas de red.

  P20:
    name: Manage segmentation
    plane: services
    verb: manage_segmentation
    resource_types: [segment, vlan]
    description: Definir segmentos y VLANs.

  P21:
    name: Manage network devices
    plane: services
    verb: manage_network_device
    resource_types: [switch, network_device]
    description: Administrar switches y dispositivos de red.

  P22-OP:
    name: Operate the SDN controller
    plane: services
    verb: operate_controller
    resource_types: [sdn_controller]
    description: Consultar topología, flujos y estado; ejecutar operaciones autorizadas.

  P22-CFG:
    name: Configure the SDN controller
    plane: services
    verb: configure_controller
    resource_types: [sdn_controller]
    description: Configurar el clúster, sus aplicaciones y sus parámetros críticos.

  P23:
    name: Manage security mechanisms
    plane: services
    verb: manage_security_mechanism
    resource_types: [mitigation, ids, ips, detection]
    description: Operar los mecanismos de detección y mitigación dentro del rango aprobado.

  P24:
    name: Manage administrators
    plane: services
    verb: manage_administrator
    resource_types: [administrative_account, administrative_it_account]
    description: Crear o modificar cuentas administrativas.

  P25:
    name: Audit operations
    plane: services
    verb: audit
    resource_types: [audit]
    description: Consultar y verificar la auditoría de operaciones.

  P26:
    name: Manage global configuration
    plane: services
    verb: manage_global_config
    resource_types: [global_configuration]
    description: Modificar la configuración global de la plataforma.

  P27:
    name: Manage recovery
    plane: services
    verb: manage_recovery
    resource_types: [platform, configuration]
    description: Ejecutar procedimientos de recuperación y restauración.

  P28:
    name: Request elevation
    plane: services
    verb: request_elevation
    resource_types: [elevation_request]
    description: Solicitar una sesión temporal con alcance elevado.

  P29:
    name: Approve elevation
    plane: services
    verb: approve_elevation
    resource_types: [elevation_request]
    description: Aprobar o rechazar una solicitud de elevación.

  P30:
    name: Register privileged device
    plane: services
    verb: register_privileged_device
    resource_types: [privileged_device, privileged_it_device]
    description: Registrar un dispositivo para sesiones privilegiadas.

  P31:
    name: Manage sessions
    plane: services
    verb: manage_session
    resource_types: [session]
    description: Consultar o revocar sesiones.

  P32:
    name: Approve high-impact action
    plane: services
    verb: approve_high_impact
    resource_types: [critical_action_request]
    description: Aprobar cuarentena, aislamiento u otra acción crítica.

  P33:
    name: Adjust detection thresholds
    plane: services
    verb: adjust_threshold
    resource_types: [detection_threshold, threshold_range]
    description: Ajustar umbrales dentro del rango aprobado.

  P34:
    name: Manage keys and certificates
    plane: services
    verb: manage_keys
    resource_types: [key_certificate]
    description: Crear, rotar o revocar claves y certificados.

  P35:
    name: Request device registration
    plane: services
    verb: request_device_registration
    resource_types: [device_registration_request]
    description: Solicitar el registro de un dispositivo; no concede confianza.

  P36:
    name: Manage audit retention and export
    plane: services
    verb: manage_audit_retention
    resource_types: [audit]
    description: Definir retención y exportar registros de auditoría.

