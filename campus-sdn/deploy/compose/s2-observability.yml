# S2 — Observabilidad: Monitor, Detección, Adaptador y sus dependencias.
# Prometheus, Grafana y Suricata son imágenes del lock; Monitor y
# Detección se construyen. El bus (S4) llega por BUS_URL.
services:
  monitor:
    build:
      context: ../..
      dockerfile: services/monitor/Dockerfile
    container_name: s2-monitor
    restart: unless-stopped
    environment:
      BUS_URL: ${BUS_URL:-}
      SAMPLE_INTERVAL_S: "5"
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8003/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  detection:
    build:
      context: ../..
      dockerfile: services/detection/Dockerfile
    container_name: s2-detection
    restart: unless-stopped
    environment:
      BUS_URL: ${BUS_URL:-}
      DETECTION_SIGMA: "5"
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8004/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  sensor_adapter:
    build:
      context: ../..
      dockerfile: services/sensor_adapter/Dockerfile
    container_name: s2-sensor-adapter
    restart: unless-stopped
    environment:
      BUS_URL: ${BUS_URL:-}
      SENSOR_WINDOW_S: "10"
    volumes:
      - suricata_logs:/var/log/suricata
    ports:
      - "8009:8009"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8009/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: s2-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    container_name: s2-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?definir GRAFANA_ADMIN_PASSWORD en .env}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  suricata:
    image: jasonish/suricata:7.0
    container_name: s2-suricata
    restart: unless-stopped
    # La NIC del espejo es una interfaz del host: red host y privilegios
    # de red. La interfaz real se confirma en H0 (MIRROR_IFACE).
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: -i ${MIRROR_IFACE:-ens5} -c /etc/suricata/suricata.yaml
    volumes:
      - suricata_logs:/var/log/suricata
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep -q suricata"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  prometheus_data:
  grafana_data:
  suricata_logs:
