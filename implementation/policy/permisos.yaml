# ---------------------------------------------------------------------------
# Reglas de separación, delegación y alcance
# ---------------------------------------------------------------------------

rules:
  - id: R-SOD-01
    name: Sin autoaprobación
    permissions: [P29, P32]
    condition: requester_id != approver_id
    effect: deny
    description: Ningún sujeto aprueba su propia solicitud.

  - id: R-SOD-02
    name: Sin autoelevación
    permissions: [P15, P16, P24]
    condition: subject_id != target_id
    effect: deny
    description: Nadie se asigna a sí mismo un rol, permiso o cuenta administrativa.

  - id: R-SOD-03
    name: Sin privilegio por unión
    permissions: ["*"]
    condition: effective_permissions(subject) <= max(role.level)
    effect: deny
    description: La combinación de roles no supera el mayor privilegio; la delegación es la única vía de ampliación.

  - id: R-DEL-01
    name: Delegación acotada
    permissions: [P14, P24, P30]
    condition: delegation.exists and delegation.from == superadministrador
    effect: deny
    description: Solo el Superadministrador delega; el Administrador de Red recibe delegación sobre cuentas y dispositivos de TI.

  - id: R-CFG-01
    name: Configuración crítica
    permissions: [P22-CFG, P26, P27]
    condition: role == superadministrador and context.time_window in [mantenimiento, emergencia]
    effect: deny
    description: Solo el Superadministrador configura; la emergencia se declara y se audita.

  - id: R-DET-01
    name: Detección separada de mitigación
    permissions: [P23]
    condition: role != especialista_ti
    effect: deny
    description: TI mitiga y ajusta umbrales; no desactiva la detección.

  - id: R-AUD-01
    name: Auditoría separada de operación
    permissions: [P25, P36]
    condition: role == superadministrador
    effect: deny
    description: El operador consulta logs, pero no administra la auditoría.

  - id: R-BG-01
    name: Break-glass fuera de P14
    permissions: [P14]
    condition: resource.type == break_glass
    effect: deny
    description: Las cuentas de emergencia se gestionan por procedimiento offline con doble control.

  - id: R-REG-01
    name: Registro no concede confianza
    permissions: [P30, P35]
    condition: action.grants_trust == true
    effect: deny
    description: El registro de un dispositivo no otorga privilegios por sí mismo.

# ---------------------------------------------------------------------------
# Delegaciones
# ---------------------------------------------------------------------------

delegations:
  - id: D-TI-01
    from: superadministrador
    to: administrador_red
    permissions: [P14, P24, P30]
    resource_scope: [cuenta_local_ti, cuenta_administrativa_ti, dispositivo_privilegiado_ti]
    valid_from: "2026-10-28"
    valid_until: "2027-01-26"
    obligations: [auditar, justificar]
    description: Registro y gestión de Especialistas de TI y sus dispositivos.

# ---------------------------------------------------------------------------
# Obligaciones
# ---------------------------------------------------------------------------

obligations:
  auditar:
    description: Registrar la decisión y el resultado en la auditoría.
  notificar:
    description: Notificar al afectado o al canal de operación.
  ttl:
    description: Fijar y respetar un tiempo de vida explícito.
  justificar:
    description: Exigir motivo escrito y vinculado a la solicitud.
  registrar_cambio:
    description: Registrar valor anterior, valor nuevo, responsable y fecha.
  vincular_aprobacion:
    description: Vincular la ejecución a la aprobación P32 vigente.
  registrar_valores:
    description: Registrar umbral anterior y nuevo, y el resultado.
  no_registrar_secreto:
    description: No escribir claves ni material secreto en logs o eventos.

# ---------------------------------------------------------------------------
# Escalera de prioridades
# ---------------------------------------------------------------------------

priorities:
  mitigacion: 1000
  sesion_privilegiada: 200
  portal: 150
  mac_ip_correctos: 120
  ip_con_mac_ajena: 110
  gestion_drop: 100
  caminos: 20
  dhcp_dns: 10
  sesion_academica: 190
  notes: >
    La sesión académica es provisional (190) y debe quedar entre portal y
    sesión privilegiada; el valor de despliegue se fija con la medición.
